name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            *.md
            examples/*.md

  style-guide-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject em dashes
        run: |
          if grep -n "—" *.md examples/*.md; then
            echo "Em dashes found. Replace with commas, parentheses, or a second sentence."
            exit 1
          fi
      - name: Reject stray quotation marks
        run: |
          if grep -n '"' *.md examples/*.md; then
            echo "Quotation marks found. Rephrase, or use inline code for literal example text."
            exit 1
          fi

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "*.md" "examples/*.md"
          fail: true
